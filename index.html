    <style>
      html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #12100E;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-text-size-adjust: 100%;
      }
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #12100E;
        -webkit-overflow-scrolling: touch;
      }
      #joyever-initial-loader {
        position: fixed;
        inset: 0;
        background-color: #12100E;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      #joyever-initial-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes softLogoPulse {
        0%, 100% {
          transform: scale(0.97);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.03);
          opacity: 1;
        }
      }
      .loading-logo-img {
        height: 52px;
        width: auto;
        max-width: 180px;
        object-fit: contain;
        animation: softLogoPulse 2.2s ease-in-out infinite;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body class="bg-[#12100E] text-[#F5F2EB] antialiased selection:bg-[#5C4436] selection:text-[#F5F2EB]">
    <!-- Joyever Initial Loader (Signature Joyever Blue #0E435A with clean logo) -->
    <div id="joyever-initial-loader">
      <img
        src="/logo-joyever-clean.png"
        alt="Joyever"
        class="loading-logo-img"
        onerror="this.src='/logo.png'"
      />
    </div>

    <div id="root"></div>
    <script>
      setTimeout(function() {
        var el = document.getElementById('joyever-initial-loader');
        if (el && !el.classList.contains('fade-out')) {
          el.classList.add('fade-out');
          setTimeout(function() { if (el) el.remove(); }, 500);
        }
      }, 1800);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
